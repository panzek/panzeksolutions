{% extends 'base.html' %}

{% load static %}

{% block title %} AI-Powered Chatbot | Panzek Solutions {% endblock %}

{% block content %}

<!-- Floating chat button -->
<button id="openChatBtn" class="fixed bottom-56 right-6 text-green-500 z-50">
    <i class="fa-solid fa-comment-dots fa-4x" aria-hidden="true" style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);"></i>
    <span class="sr-only">Chat button</span>
</button>

<!-- Chat overlay window -->
<!-- <div class="hero"> -->
    <div id="chatWindow" class="fixed bottom-56 right-6 z-50 hidden flex flex-col items-stretch mt-6">
        <!-- Header -->
        <div class="card bg-base-100 w-full max-w-md shadow-2xl">
            <div class="bg-primary text-white p-4 rounded-t-xl flex justify-between items-center">
                <h2 class="card-title text-lg font-semibold">Customer Support</h2>
                <button id="closeChatBtn" class="btn btn-sm btn-circle text-content-primary">X</button>
            </div>
            <div class="p-6">
                <!-- Messages -->
                <div id="chatMessages" class="card-actions flex-1 pr-2 max-h-[300px] overflow-y-auto space-y-3 bg-base-100">
                    <!-- User and Bot Messages will dynamically be added here. Chat Messages text below is hard-coded for testing -->
                </div>
                <!-- Chat form -->
                 <form id="chatform" class="p-4 border-t border-base-200 bg-white">
                    <div class="flex items-center gap-2">
                        {% csrf_token %}
                        <input type="text" id="messageInput" class="input input-bordered w-full" placeholder="Type your message..." autocomplete="off" />
                        <label for="fileInput" class="btn btn-outline btn-sm">
                            <i class="fa-solid fa-paperclip fa-xl"></i>
                        </label>
                        <input type="file" id="fileInput" class="hidden" />
                        <button type="submit" class="btn btn-primary btn-sm">Send</button>
                    </div>
                 </form>
            </div>
        </div>
    </div>
<!-- </div> -->
<script src="{% static 'chatbot/js/chats.js' %}"></script>
{% endblock %}
