<!-- Chat overlay window -->
<div id="chatWindow" class="fixed bottom-6 right-6 z-50 hidden flex flex-col items-stretch mt-6" >
    <!-- Chat card -->
    <div class="card bg-base-100 max-w-md shadow-2xl mt-6">
        <!-- Header -->
        <div class="bg-primary text-white p-4 rounded-t-xl flex justify-between items-center">
            <h2 class="card-title text-base lg:text-md">Customer Support (24/7 AI Assistant)</h2>
            <button id="closeChatBtn" class="btn btn-sm btn-circle text-content-primary">X</button>
        </div>
        <div class="p-6">
            <!-- Messages Area-->
            <div id="chatMessages" class="card-actions flex-1 pr-2 max-h-[300px] overflow-y-auto gap-y-3 bg-base-100">
                <!-- User and Bot Messages will be appended dynamically here -->
            </div>
            <!-- Chat form -->
            <form id="chatform" class="p-4 border-t border-base-200 bg-white">
            <div class="flex items-center gap-2">
                {% csrf_token %}
                <input type="text" id="messageInput" class="input input-bordered w-full" placeholder="Type your message..." autocomplete="off" />
                <label for="fileInput" class="btn btn-outline btn-sm">
                    <i class="fa-solid fa-paperclip fa-xl"></i>
                </label>
                <input type="file" id="fileInput" class="hidden" />
                <button type="submit" class="btn btn-primary btn-sm">Send</button>
            </div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'chatbot/js/chats.js' %}"></script>
